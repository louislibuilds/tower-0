<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Tower Zero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a7bd5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a5a9e" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- ground grid -->
  <g opacity="0.22" stroke="#5a8fd4" stroke-width="1">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="600" y1="520" x2="600" y2="630"/>
    <line x1="480" y1="520" x2="720" y2="630"/>
    <line x1="720" y1="520" x2="480" y2="630"/>
    <line x1="360" y1="520" x2="840" y2="630"/>
    <line x1="840" y1="520" x2="360" y2="630"/>
  </g>
  <!-- abstract tower mass -->
  <rect x="555" y="120" width="90" height="400" rx="2" fill="url(#tower)" stroke="#6ea8ff" stroke-width="2"/>
  <polygon points="600,70 645,120 555,120" fill="#2a5a9e" stroke="#6ea8ff" stroke-width="2"/>
  <rect x="582" y="88" width="36" height="14" rx="2" fill="#f5c842" opacity="0.95"/>
  <!-- floor bands -->
  <g stroke="#6ea8ff" stroke-width="1" opacity="0.45">
    <line x1="555" y1="200" x2="645" y2="200"/>
    <line x1="555" y1="280" x2="645" y2="280"/>
    <line x1="555" y1="360" x2="645" y2="360"/>
    <line x1="555" y1="440" x2="645" y2="440"/>
  </g>
  <!-- lit windows -->
  <g fill="#f5c842" opacity="0.85">
    <rect x="568" y="150" width="18" height="24" rx="1"/>
    <rect x="614" y="230" width="18" height="24" rx="1"/>
    <rect x="568" y="310" width="18" height="24" rx="1"/>
    <rect x="614" y="390" width="18" height="24" rx="1"/>
  </g>
  <text x="120" y="180" fill="#f2f2f2" font-family="ui-monospace, monospace" font-size="72" letter-spacing="12">TOWER</text>
  <text x="120" y="260" fill="#6ea8ff" font-family="ui-monospace, monospace" font-size="72" letter-spacing="12">ZERO</text>
  <text x="120" y="320" fill="#888" font-family="ui-monospace, monospace" font-size="22" letter-spacing="4">LOUIS LI · BUBBLECHICKENLAB</text>
  <text x="120" y="560" fill="#555" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3">MASTER OF IT PORTFOLIO</text>
</svg>
